name: stream_feeds
description: The official Dart client for Stream Feeds, a service for building applications with activity feeds.
version: 0.5.1
repository: https://github.com/GetStream/stream-feeds-flutter

# Note: The environment configuration and dependency versions are managed by Melos.
#
# Do not edit them manually.
#
# Steps to update dependencies:
#   1. Modify the version in the melos.yaml file.
#   2. Run `melos bootstrap` to apply changes.
#
# Steps to add a new dependency:
#   1. Add the dependency to this list.
#   2. Add it to the melos.yaml file for future updates.

environment:
  sdk: ^3.12.0

dependencies:
  clock: ^1.1.2
  collection: ^1.18.0
  dio: ^5.9.0
  equatable: ^2.0.5
  freezed_annotation: ^3.0.0
  http: ^1.1.0
  intl: ">=0.18.1 <=0.21.0"
  json_annotation: ^4.9.0
  meta: ^1.9.1
  retrofit: ^4.9.2
  rxdart: ^0.28.0
  state_notifier: ^1.0.0
  stream_core:
    # The ignore below silences `invalid_dependency` because we occasionally
    # pin stream_core to a git ref to iterate on it alongside this
    # SDK between its releases.
    #
    # **Note:** Before publishing stream_feeds, this MUST be swapped
    # back to a pub version constraint — git deps are not allowed on pub.dev
    # and will block the release.
    # ignore: invalid_dependency
    git:
      url: https://github.com/GetStream/stream-core-flutter.git
      ref: 505432f213af8911d54ab3c855d6ad6fbe492fc9
      path: packages/stream_core
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  fake_async: ^1.3.3
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  retrofit_generator: ^10.2.6
  stream_feeds_test:
    path: ../stream_feeds_test