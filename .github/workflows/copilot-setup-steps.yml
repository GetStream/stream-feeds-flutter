name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation,
# and allow manual testing through the repository's "Actions" tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for the steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # Required to clone the repository for installing dependencies.
      contents: read

    steps:
      # Checkout the repository code.
      # Note: fetch-depth is overridden by Copilot to allow rollback commits.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Flutter SDK (stable channel) which includes Dart SDK.
      - name: Install Flutter
        uses: subosito/flutter-action@v2

      # Install Melos for monorepo management.
      - name: Install Melos
        run: flutter pub global activate melos

      # Bootstrap all packages and sync dependencies from melos.yaml.
      - name: Bootstrap Workspace
        run: melos bootstrap --verbose
