# Copilot Setup Steps for Stream Feeds Flutter SDK
# This file defines the setup steps that GitHub Copilot coding agent should run
# to prepare the environment before working on this repository.

steps:
  # Step 1: Install Flutter (includes Dart SDK)
  - name: Install Flutter
    run: |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found. Installing Flutter..."
        git clone https://github.com/flutter/flutter.git -b stable --depth 1 /opt/flutter
        export PATH="/opt/flutter/bin:$PATH"
        echo 'export PATH="/opt/flutter/bin:$PATH"' >> ~/.bashrc
        flutter precache
        flutter doctor
      else
        echo "Flutter is already installed: $(flutter --version | head -1)"
      fi
    description: Install Flutter SDK (stable channel) which includes Dart SDK

  # Step 2: Verify Flutter/Dart versions
  - name: Verify Flutter and Dart versions
    run: |
      flutter --version
      dart --version
    description: Verify Flutter 3.27.4+ and Dart 3.6.2+ are available

  # Step 3: Install Melos globally
  - name: Install Melos
    run: |
      flutter pub global activate melos
      echo 'export PATH="$HOME/.pub-cache/bin:$PATH"' >> ~/.bashrc
      export PATH="$HOME/.pub-cache/bin:$PATH"
      melos --version
    description: Install Melos for monorepo management

  # Step 4: Bootstrap the workspace
  - name: Bootstrap workspace
    run: |
      melos bootstrap --verbose
    description: Bootstrap all packages and sync dependencies from melos.yaml

  # Step 5: Verify code generation tools
  - name: Verify code generation setup
    run: |
      echo "Code generation tools are installed via melos bootstrap"
      echo "Freezed, json_serializable, retrofit_generator, and build_runner are available"
    description: Confirm code generation tools are available
